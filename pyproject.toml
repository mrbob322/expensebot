[project]
name = "expensebot"
version = "0.1.0"
description = "Telegram-бот для учёта личных расходов"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["aiogram>=3.4", "python-dotenv>=1.0"]

[project.scripts]
expensebot = "expensebot.bot:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
pythonpath = ["src"]
